<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>野の花　精神・知的の利用者の訪問アセスメント</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* レイアウト: 760px の一本の列。上に4つのタブ、一覧 → 詳細 の二段。リスクは色の帯と「高・中」の札で示す */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#1C2A28; --muted:#566865; --line:#D8E1DE;
  --accent:#2C6A5C; --accent-ink:#FFFFFF; --accent-soft:#E2EEEA;
  --danger:#B42318; --danger-soft:#FCEBE8; --warn:#8A5A00; --warn-soft:#FFF3D9; --info:#1F5A8A; --info-soft:#E5EFF8;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221F; --ink:#E3ECE9; --muted:#9AADA8; --line:#2B3834;
  --accent:#7DC3AF; --accent-ink:#0E1E19; --accent-soft:#1E3530;
  --danger:#FF8F84; --danger-soft:#3A1F1C; --warn:#F0C268; --warn-soft:#342A13; --info:#8EC1EA; --info-soft:#182A3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221F; --ink:#E3ECE9; --muted:#9AADA8; --line:#2B3834;
  --accent:#7DC3AF; --accent-ink:#0E1E19; --accent-soft:#1E3530;
  --danger:#FF8F84; --danger-soft:#3A1F1C; --warn:#F0C268; --warn-soft:#342A13; --info:#8EC1EA; --info-soft:#182A3A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{padding-block:22px 10px}
header.top h1{font-family:var(--f-display);font-size:1.55rem;line-height:1.3;margin:0;letter-spacing:.02em;text-wrap:balance}
header.top p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
header.top p.brand{margin:0 0 2px;font-family:var(--f-display);font-weight:700;font-size:.9rem;letter-spacing:.12em;color:var(--accent)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-size:.78rem;font-weight:700;padding:8px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1.3}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--info);outline-offset:2px}
main{padding-top:18px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-size:1.35rem;line-height:1.35;margin:0;text-wrap:balance}
h3{font-size:1rem;margin:0 0 6px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3 .k{font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-weight:500}
p{margin:0}
.lead{color:var(--muted);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card b{font-size:1rem}
.card span{color:var(--muted);font-size:.82rem;line-height:1.5}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;min-width:0}
.panel.soft{background:var(--accent-soft);border-color:transparent}
ul.plain{margin:0;padding-left:1.2em}
ul.plain li+li{margin-top:3px}
.back{align-self:flex-start;font:inherit;font-size:.9rem;background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 0}
.sym{display:grid;gap:10px}
.sym div{border-left:3px solid var(--line);padding-left:10px}
.sym b{display:block;font-size:.9rem}
.risks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.risks li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--bg)}
.risks li.h{background:var(--danger-soft)}
.risks li.m{background:var(--warn-soft)}
.risks li.l{background:var(--info-soft)}
.lv{font-size:.74rem;font-weight:700;border-radius:999px;padding:1px 9px;margin-top:3px;white-space:nowrap;border:1px solid currentColor}
.h .lv{color:var(--danger)} .m .lv{color:var(--warn)} .l .lv{color:var(--info)}
.risks b{display:block}
.risks p{font-size:.9rem;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.ok h3{color:var(--accent)} .ng h3{color:var(--danger)}
.say{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:.95rem}
.say + .say{margin-top:8px}
.say small{display:block;font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;line-height:1.5}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.x::after{content:"×";margin-left:6px;opacity:.75}
.chip.link{color:var(--accent);border-color:var(--accent)}
input[type=search],input[type=text]{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.cls-h{font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:6px 0 -2px}
.drow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.gen{color:var(--muted);font-size:.9rem;font-weight:400}
.badge{font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.alert{border:1px solid var(--danger);background:var(--danger-soft);border-radius:var(--r);padding:12px 14px}
.alert b{color:var(--danger)}
.note{font-size:.8rem;color:var(--muted);line-height:1.6}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px;background:var(--surface)}
.sugg button{font:inherit;text-align:left;padding:8px 12px;background:none;border:none;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer}
.sugg button:last-child{border-bottom:none}
.sugg button:hover{background:var(--accent-soft)}
.sugg small{color:var(--muted);margin-left:6px}
.step{display:flex;flex-direction:column;gap:10px}
.step-h{display:flex;align-items:center;gap:10px}
.step-h i{font-style:normal;font-weight:700;font-size:.8rem;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.step-h b{font-size:1rem}
.example{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--info-soft);color:var(--info);border-radius:10px;padding:8px 12px;font-size:.88rem;font-weight:700}
.btn{font:inherit;font-weight:700;font-size:.9rem;padding:8px 14px;border-radius:10px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer}
.btn.fill{background:var(--accent);color:var(--accent-ink)}
.out-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;cursor:pointer;border-radius:8px}
.checks label:hover{background:var(--bg)}
.checks input{width:18px;height:18px;margin-top:4px;accent-color:var(--accent);flex:none}
.checks small{display:block;color:var(--muted);font-size:.82rem;line-height:1.5}
.drugline{padding:8px 0;border-top:1px solid var(--line)}
.drugline:first-child{border-top:none;padding-top:0}
.drugline b{display:block}
.em{display:flex;flex-direction:column;gap:8px}
.em h3{font-size:1.05rem}
.em .lbl{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
.em .act{background:var(--danger-soft);border-radius:10px;padding:8px 12px}
.em .act .lbl{color:var(--danger)}
.grp{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grp-i+.grp-i{border-top:1px solid var(--line)}
.grp-h{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;font:inherit;font-weight:700;font-size:.92rem;text-align:left;padding:11px 12px;background:var(--surface);color:var(--ink);border:none;cursor:pointer}
.grp-h:hover{background:var(--accent-soft)}
.grp-n{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:.8rem;white-space:nowrap}
.grp-n i{font-style:normal;color:var(--muted);font-size:.7rem}
.grp-b{padding:4px 12px 12px;background:var(--surface)}
.chip .alt{display:block;font-size:.7rem;opacity:.75;line-height:1.2}
.frow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:none;padding-top:2px}
.fl{font-weight:700;font-size:.9rem}
.frow input[type=text],.frow input[type=date],.vit input,.gafrow input{width:100%;max-width:280px;font:inherit;font-size:.95rem;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.vit{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.vit label,.tlabel{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700}
.tlabel textarea{width:100%;font:inherit;font-size:.95rem;font-weight:400;min-height:72px}
.tlist{display:flex;flex-direction:column;gap:12px}
.gafrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.gafrow input{max-width:110px}
.gafhint{font-size:.88rem;color:var(--accent);font-weight:700}
pre.out{white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);font-size:.9rem;line-height:1.7;background:var(--bg);border-radius:10px;padding:10px 12px;margin:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sec-h h3{margin:0}
.subtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.subtabs button{font:inherit;font-size:.85rem;font-weight:700;padding:9px 4px;border-radius:10px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer;line-height:1.3}
.subtabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:480px){.subtabs{grid-template-columns:repeat(2,1fr)}}
.foot-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
a{color:var(--info)}
.chip{min-height:38px}
.btn{min-height:40px}
.pii{border-color:var(--danger)!important;outline:2px solid var(--danger)}
.btn.sm{font-size:.8rem;padding:5px 12px}
.selmeds{display:flex;flex-wrap:wrap;gap:8px}
.selmed{display:flex;gap:4px;align-items:center;padding:3px;border:1px solid var(--line);border-radius:999px}
textarea{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
footer{margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:no-preference){.card,.chip,nav.tabs button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="brand">野の花</p>
    <h1>精神・知的の利用者の訪問アセスメント</h1>
    <p>精神の病気や知的障害のある利用者さんの訪問で、病気・お薬・リスクを確かめて説明するための手引き</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="画面の切りかえ">
    <button id="tab-dis" role="tab" data-tab="dis">病名から</button>
    <button id="tab-drug" role="tab" data-tab="drug">薬から</button>
    <button id="tab-as" role="tab" data-tab="as">アセス<br>・記録</button>
    <button id="tab-sum" role="tab" data-tab="sum">まとめ<br>アイちゃん用</button>
    <button id="tab-em" role="tab" data-tab="em">危険な<br>サイン</button>
  </nav>
  <main id="main"></main>
  <footer>
    <p class="note">ここに書いてあるのは一般的な要点です（2026年11月時点の添付文書・診療ガイドラインの内容をもとに、訪問看護で使う形にまとめています）。量・飲み合わせ・禁忌の最終確認は、添付文書・主治医・薬剤師で行ってください。利用者さんの名前などの個人情報は入力しないでください。</p>
  </footer>
</div>

<script>
/* ================= 薬の分類（共通の内容） ================= */
const CLS={
 ap:{n:'抗精神病薬',what:'幻覚・妄想・興奮をしずめ、再発を防ぐ薬。統合失調症のほか、双極性障害、うつ病の補助、認知症の興奮などにも使われます。',
  side:['眠気・だるさ','便秘','体重増加・食欲が増える','口の渇き','立ちくらみ（起立性低血圧）','手のふるえ・動きが遅い・表情が乏しい・小刻みに歩く（パーキンソン症状）','そわそわしてじっとしていられない（アカシジア）','月経不順・乳汁が出る・性機能の低下（高プロラクチン血症）'],
  danger:['悪性症候群：高熱・体のこわばり・大量の汗・意識がぼんやり・脈が速い','急性ジストニア：首が反る・目が上を向いたまま・舌が出る（飲み始め・増量の数日以内）','腸閉塞：何日も便が出ない・お腹が張る・吐く','高血糖：のどの渇き・水をたくさん飲む・尿が多い・だるい','飲み込みにくさ・むせ（誤嚥性肺炎）','遅発性ジスキネジア：口をもぐもぐ・舌が勝手に動く（長く飲んでいる人）'],
  obs:['最後の排便日と便の回数','体重（できれば腹囲も）','ふるえ・歩き方・よだれ・表情','そわそわ感（アカシジアは「不安が強くなった」と見間違えやすい）','眠気・立ちくらみ・転倒','水分をとる量（多すぎ・少なすぎ）'],
  tip:'飲み始めや増量の後に「イライラ・落ち着かない」が出たら、病状の悪化ではなくアカシジア（副作用）のことがあります。主治医に伝えましょう。',
  say:'頭の中のざわざわ（不安や聞こえる声）をしずめて、再発を防ぐお薬です。眠気や便秘が出ることがあるので、困ったら教えてください。自分の判断でやめると、しばらくして調子を崩すことが多いので、やめたい時はまず相談してください。'},
 ad:{n:'抗うつ薬',what:'脳の中のセロトニンやノルアドレナリンの働きを整え、気分の落ち込みや不安をやわらげる薬。効果が出るまで2〜4週間かかります。',
  side:['飲み始めの吐き気・胃の不快感（1〜2週で軽くなることが多い）','眠気、または眠りにくさ','頭痛','性機能の低下','口の渇き・便秘（古いタイプの三環系で強い）'],
  danger:['アクチベーション症候群：飲み始め・増量の時期に、不安・焦り・イライラ・衝動的な行動が強まる。24歳以下では死にたい気持ちが強まることがある','セロトニン症候群：興奮・ふるえ・手足がぴくつく・汗・下痢・発熱・脈が速い','躁転：双極性障害の人で、急に元気になりすぎる・眠らない・お金を使う','中断症候群：急にやめると、めまい・耳鳴り・しびれ・電気が走る感じ・イライラ','低ナトリウム血症（高齢者）：だるさ・ぼんやり・ふらつき','出血しやすい：痛み止めや血をサラサラにする薬と一緒の時','【併用禁忌】多くの抗うつ薬は、MAO阻害薬（パーキンソン病の薬：エフピー・アジレクト・エクフィナ）と一緒に使えない（デジレルは併用注意）。SSRIの一部（パキシル・ジェイゾロフト・デプロメール・レクサプロ）はピモジド（オーラップ）も'],
  obs:['飲み始め2週間の焦り・イライラ・死にたい気持ち','吐き気と食事量','睡眠','効かないからと自己中断していないか','高齢者は意識のはっきりさ・ふらつき'],
  tip:'最初の2〜4週間は「効かない」と感じてやめやすい時期です。効き方の見通しを先に伝えておくと続けやすくなります。',
  say:'気分の落ち込みや不安をやわらげるお薬です。効き始めるまで2〜4週間かかります。飲み始めに吐き気が出ることがありますが、多くは1〜2週間で軽くなります。飲み始めに、そわそわ・イライラが強くなったときはすぐ教えてください。'},
 ms:{n:'気分安定薬',what:'気分の波（躁とうつ）を小さくし、再発を防ぐ薬。てんかんの薬でもあるものが多くあります。',
  side:['眠気・ふらつき','体重増加（薬による）','手のふるえ（薬による）'],
  danger:['薬ごとに危険な副作用が違います（上の「この薬で特に注意」を見てください）'],
  obs:['採血（血中濃度・肝機能・血球）の予定と結果','発疹・発熱・口内炎','ふるえ・下痢・ふらつき','妊娠の可能性'],
  tip:'定期的な採血が必要な薬が多いので、検査日を一緒に確認しましょう。',
  say:'気分の波を小さくして、再発を防ぐお薬です。調子がよい時も続けることが大切です。決められた採血の日は必ず受けてください。'},
 ep:{n:'抗てんかん薬',what:'脳の神経の過剰な興奮をおさえて、てんかん発作を防ぐ薬。毎日決まった時間に飲み続けることで発作を防ぎます。気分の安定や痛みの治療に使われるものもあります。',
  side:['眠気','ふらつき・めまい','物が二重に見える','だるさ','イライラ・気分の変化（薬による）'],
  danger:['飲み忘れ・急な中止で発作が増える','けいれん重積：発作が5分以上続く・意識が戻らないまま発作をくり返す → 119','重い薬疹：熱を伴う発疹・口内炎・目の充血','気分の落ち込み・死にたい気持ち（抗てんかん薬全体で報告がある）','発作やふらつきによる転倒・けが'],

const cleanQ=q=>String(q).replace(/[「『][^」』]*[」』]?/g,'').replace(/[0-9０-９.．]+\s*(mg|ｍｇ|μg|g|ｇ|%|％|ml|mL|ｍL)?/gi,'').replace(/口腔内崩壊錠|OD錠|ＯＤ錠|徐放錠|配合内用剤|内用液|カプセル|シロップ|細粒|顆粒|坐剤|テープ|貼付剤|錠|散/g,'');

const gname=d=>d.g.replace(/（.*?）/g,'');
const chipSub=d=>(d.alt?d.alt.join('・')+' / ':'')+(d.g==='漢方薬'?'漢方薬':gname(d));

    if(s[2]!==g){g=s[2]; html+=`<h2 style="margin-top:8px">${esc(g)}</h2>`; if(g==='訪問看護報告書（精神）') html+=`<p class="note">アイちゃんの「月次帳票」→ その月の「精神様式」の報告書に貼ります。</p>`; if(g==='指示書') html+=`<p class="note">アイちゃんの「指示書」の画面には期間だけを登録します。照らし合わせは、指示書が届いた時と更新の時に見ます。</p>`; if(g==='サマリー') html+=`<p class="note">アイちゃんの「サマリー」に貼ります。入院や引き継ぎ、終了の時に使います。</p>`; if(g==='フェイスシート（訪問看護記録書Ⅰ）') html+=`<p class="note">アイちゃんの「フェイスシート」に貼ります。主に初回訪問の時に使います。</p>`; if(g==='緊急時連絡票') html+=`<p class="note">アイちゃんの「緊急時連絡票」に貼ります。初回訪問や、クライシスプラン・薬が変わった時に見直します。</p>`; if(g==='訪問看護計画書（精神）') html+=`<p class="note">アイちゃんの「計画書」の同じ欄に貼ります。（案）と書いた欄は、看護師が読んで直してから使ってください。</p>`;}
    html+=`<div class="panel"><div class="sec-h"><h3>${esc(s[0])}</h3><button class="btn sm" data-copysec="${i}">コピー</button></div>${s[3]?`<p class="note" style="margin:-2px 0 6px">${esc(s[3])}</p>`:''}<pre class="out" id="sec-${i}">${esc(s[1])}</pre></div>`;
  });
  return `${oldBanner()}${piiAny()?'<div class="alert"><b>名前や電話番号のような文字が入っています。</b> 貼りつける前に確かめてください。</div>':''}${S.a.example?`<div class="example"><span>例の内容が入っています。「アセスメント・記録」で選び直してください。</span></div>`:''}
  <div class="panel soft"><h3>アイちゃんへの転記のしかた</h3>
    <ul class="plain"><li>アイちゃんで「看護記録編集」→ その日の記録の「ケア項目」を開きます</li><li>下の欄の順番は、アイちゃんの画面の上からの順番と同じです。項目ごとの「コピー」を押して、同じ名前の欄に貼りつけます</li><li>チェック欄（精神・実施した看護内容など）は、書いてある項目にアイちゃん側でチェックを入れます</li><li>計画書の欄は、月初めや初回に「計画書」の画面で使います</li></ul>
    <div class="chips" style="margin-top:10px">${SUMF.map(x=>`<button class="chip ${(S.sumF||'all')===x[0]?'on':''}" data-sumf="${x[0]}" aria-pressed="${(S.sumF||'all')===x[0]}">${esc(x[1])}</button>`).join('')}</div>
    <div style="margin-top:10px"><button class="btn fill" data-copysec="all">表示中の欄を全部コピー</button></div></div>
  ${html}
  <details class="panel"><summary style="cursor:pointer;font-weight:700">計画書の文例・書き方の出典</summary><ul class="plain" style="margin-top:8px;font-size:.85rem;word-break:break-all">${SRC.map(x=>'<li>'+esc(x[0])+'：<a href="'+x[1]+'" target="_blank" rel="noopener">'+esc(x[1])+'</a></li>').join('')}</ul><p class="note" style="margin-top:6px">文例は、公開されている記載例から共通する考え方をまとめ、書き直したものです。認知症・摂食障害・ADHD・知的障害は公開例が少なく、一般的な看護の内容で補っています。</p></details>
  <p class="note">転記が終わったら、「アセスメント・記録」の「すべて消す」で、この端末に残っている内容を消してください。</p>`;
}
function copyText(txt,btn,el){
  const orig=btn.textContent;
  const done=()=>{btn.textContent='コピーしました';setTimeout(()=>{btn.textContent=orig},1800);};
  const fb=()=>{ if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);} btn.textContent='選んだ文をコピーしてください'; };
  try{navigator.clipboard.writeText(txt).then(done,fb);}catch(e){fb();}
}

/* ================= 操作 ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  const ds=t.dataset;
  if(ds.tab){S.tab=ds.tab; if(ds.tab==='dis')S.dis=null; if(ds.tab==='drug')S.drug=null; save(); render(); scrollTo(0,0); return;}
  if(ds.dis){S.tab='dis';S.dis=ds.dis;render();scrollTo(0,0);return;}
  if(ds.drug){S.tab='drug';S.drug=ds.drug;render();scrollTo(0,0);return;}
  if(ds.back){if(ds.back==='dis')S.dis=null;else S.drug=null;render();scrollTo(0,0);return;}
  if(ds.cf){S.cf=ds.cf;document.querySelectorAll('#cf .chip').forEach(c=>c.classList.toggle('on',c.dataset.cf===S.cf));fillDrugList();return;}
  if(ds.addas){if(S.a.example){S.a={dis:[],drugs:[],bg:[],example:false};S.f={_v:2,date:today()};} if(!hasD(ds.addas))S.a.dis.push(ds.addas); touchA(); S.tab='as'; render(); scrollTo(0,0); return;}
  if(ds.clear){if(!t.dataset.armed){t.dataset.armed='1';const o=t.textContent;t.textContent='もう一度押すと全部消えます';setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent=o;}},4000);return;} S.oldDay='';S.a={dis:[],drugs:[],bg:[],prn:[],example:false};S.f={_v:2,date:today()};S.chk={};save();render();return;}
  if(ds.sel){leaveEx();toggleSel(ds.sel,ds.v); touchA(); render(); return;}
  if(ds.keepold){S.oldDay=''; S.day=today(); save(); render(); return;}
  if(ds.sub){S.sub=ds.sub; save(); render(); scrollTo(0,0); return;}
  if(ds.sumf){S.sumF=ds.sumf; save(); render(); return;}
  if(ds.gosum){S.sumF=(S.sub&&S.sub!=='base')?S.sub:'all';S.tab='sum'; save(); render(); scrollTo(0,0); return;}
  if(ds.copysec!==undefined){const secs=buildSum(); if(ds.copysec==='all'){copyText(secs.filter(s=>sumShow(s[2])).map(s=>'【'+s[0]+'】\n'+s[1]).join('\n\n'),t,document.getElementById('main'));} else {const s=secs[+ds.copysec]; if(s) copyText(s[1],t,document.getElementById('sec-'+ds.copysec));} return;}
  if(ds.tdis){leaveEx();const i=S.a.dis.indexOf(ds.tdis); i<0?S.a.dis.push(ds.tdis):S.a.dis.splice(i,1); touchA(); render(); return;}
  if(ds.tbg){leaveEx();const i=S.a.bg.indexOf(ds.tbg); i<0?S.a.bg.push(ds.tbg):S.a.bg.splice(i,1); touchA(); render(); return;}
  if(ds.adddrug){leaveEx();if(!hasG(ds.adddrug))S.a.drugs.push(ds.adddrug); touchA(); render(); const p=document.getElementById('apick'); if(p)p.focus(); return;}
  if(ds.grp){S.open[ds.grp]=!S.open[ds.grp]; render(); return;}
  if(ds.tdrug){leaveEx();const i=S.a.drugs.indexOf(ds.tdrug); i<0?S.a.drugs.push(ds.tdrug):S.a.drugs.splice(i,1); touchA(); render(); return;}
  if(ds.tprn){leaveEx();S.a.prn=S.a.prn||[]; const i=S.a.prn.indexOf(ds.tprn); i<0?S.a.prn.push(ds.tprn):S.a.prn.splice(i,1); touchA(); render(); return;}
  if(ds.rmdrug){leaveEx();S.a.prn=(S.a.prn||[]).filter(x=>x!==ds.rmdrug); S.a.drugs=S.a.drugs.filter(x=>x!==ds.rmdrug); touchA(); render(); return;}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;fillDrugList();}
  if(e.target.id==='apick'){fillSugg(e.target.value);}
  if(e.target.dataset&&e.target.dataset.f){if(S.a.example) leaveEx(); S.f[e.target.dataset.f]=e.target.value; touchA(); piiCheck(e.target);
    if(e.target.dataset.f==='gaf'){const h=document.getElementById('gafhint'); if(h) h.textContent=gafText(e.target.value)||(e.target.value?'1〜100の数を入れてください':'');}}
});
document.addEventListener('change',e=>{
  if(!e.target.dataset) return;
  if(e.target.dataset.chk!==undefined){S.chk[e.target.dataset.chk]=e.target.checked; save();}
  if(e.target.dataset.ex){if(S.a.example){leaveEx();S.f[e.target.dataset.ex]=e.target.checked;touchA();render();return;} S.f[e.target.dataset.ex]=e.target.checked; touchA();}
  if(e.target.dataset.f&&e.target.type==='date'){leaveEx();S.f[e.target.dataset.f]=e.target.value; touchA();}
});
document.addEventListener('focusin',e=>{
  const t=e.target; if(!S.a.example||!t||!t.dataset||!t.dataset.f||t.type==='date') return;
  const id=t.id; leaveEx(); touchA(); render(); const el=document.getElementById(id); if(el) el.focus();
});
document.addEventListener('toggle',e=>{ if(e.target&&e.target.id==='gafdet') S.gafOpen=e.target.open; },true);
document.addEventListener('keydown',e=>{
  if(e.target.id==='apick'&&e.key==='Enter'){const b=document.querySelector('#asugg [data-adddrug]'); if(b){e.preventDefault(); b.click();}}
});
render();
